name: test

# Pushes to main run this through merge.yml, which deploys
# only once it and the other checks pass.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.25.x', '1.26.x', '1.27.x' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go version
      - run: go test -v ./...
  gosaml:
    # tools/gosaml is its own module (with a replace directive pointing at
    # this repo), so `go test ./...` at the root does not reach it.
    # It is built and deployed with the latest Go, so test with only that.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/gosaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: tools/gosaml/go.sum
      - run: go version
      - run: go test -v ./...
