{{define "content"}}{{with .Data}}
<section class="card narrow">
  <p class="eyebrow"><span class="badge sp">SP</span> {{.Name}}</p>
  <h1 class="result {{if .OK}}ok{{else}}bad{{end}}">{{if .OK}}Logged out{{else}}Logged out, with a problem{{end}}</h1>
  <p class="lead">{{.Message}}</p>
  {{if .Subject}}<p class="meta">Session of <code>{{.Subject}}</code></p>{{end}}
  {{if .Detail}}<pre class="detail">{{.Detail}}</pre>{{end}}
  <div class="row">
    <a class="button" hx-boost="false" href="/sp/{{.InstanceID}}/login">Log in again</a>
    {{if .ManageURL}}<a class="button secondary" href="{{.ManageURL}}">Manage this SP</a>{{end}}
  </div>
</section>
{{end}}{{end}}
